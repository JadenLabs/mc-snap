[package]
name = "mc-snap"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Declarative Minecraft server management. Pin Minecraft, loader, mods, Java, and configs in one YAML file; resolve, install, run, and ship a reproducible bundle."
readme = "README.md"
repository = "https://github.com/jadenlabs/mc-snap"
homepage = "https://github.com/jadenlabs/mc-snap"
documentation = "https://docs.rs/mc-snap"
keywords = ["minecraft", "server", "cli", "fabric", "modrinth"]
categories = ["command-line-utilities", "games"]

[[bin]]
name = "mc-snap"
path = "src/main.rs"

[lib]
name = "mc_snap"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
toml = "0.8"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "5"
futures-util = "0.3"
tempfile = "3"
zip = "2"
inquire = "0.7"
rand = "0.8"
fs2 = "0.4"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
